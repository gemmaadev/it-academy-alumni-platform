<header id="header" class="header">
  <!-- Desktop navigation -->
  <nav class="header-nav only-desk">
    <div class="logo-and-items-container">
      <a href="/home" class="header-logo">
        <img src="/logos/logo-xlumni.svg" alt="XLumni" class="logo-img" />
        <span class="logo-text hidden">Alumni Connect</span>
      </a>

      <ul class="header-menu">
        <li class="header-menu-item">
          <a href="/home" class="header-menu-link">Home</a>
        </li>
        <li class="header-menu-item">
          <a href="/networking" class="header-menu-link">Networking</a>
        </li>
        <li class="header-menu-item">
          <a href="/job-opportunities" class="header-menu-link">Job portal</a>
        </li>
      </ul>
    </div>

    <!-- Desktop Home actions -->
    <div class="header-actions only-desk hidden">
      <a href="/login" class="btn btn-secondary header-btn">
        <img src="/icons/icon-join-header.svg" alt="" />
        Sign up
      </a>
      <a href="/login" class="btn btn-gradient header-btn">
        <img src="/icons/icon-user-header.svg" alt="" />
        How we see you
      </a>
    </div>

    <!-- Desktop Default actions -->
    <div class="header-icons only-desk hidden">
      <button type="button" class="header-icon-btn" aria-label="Search">
        <img src="/icons/icon-search.svg" alt="" />
      </button>
      <button type="button" class="header-icon-btn" aria-label="Notifications">
        <img src="/icons/icon-notifications.svg" alt="" />
      </button>
      <button type="button" class="header-icon-btn" aria-label="Settings">
        <img src="/icons/icon-settings.svg" alt="" />
      </button>
      <a href="#" aria-label="View profile">
        <img src="/img/avatar.jpg" alt="" class="avatar" />
      </a>
    </div>
  </nav>

  <!-- Mobile header -->
  <div class="header-mobile only-mobile">
    <button type="button" class="header-back" aria-label="Go back">
      <img src="/icons/icon-arrow-left.svg" alt="" />
    </button>

    <span class="header-title" id="page-title"></span>

    <div class="header-mobile-actions">
      <button type="button" class="header-icon-btn" aria-label="Statistics">
        <img src="/icons/icon-stats.svg" alt="" />
      </button>
      <a href="/profile" aria-label="View profile">
        <img src="/img/avatar.jpg" alt="" class="avatar" />
      </a>
    </div>
  </div>
</header>
