<main class="login-container">
  <div class="login-page">
    <header>
      <h1 class="login-title">Create account</h1>
      <p class="login-subtitle">Join us to connect and share opportunities!</p>
    </header>

    <form class="login-form" aria-label="Registration form">
      <fieldset>
        <legend class="visually-hidden">Personal information</legend>
        <div class="form-field">
          <div class="input-wrapper">
            <label for="first-name" class="visually-hidden"
              >Enter your first name</label
            >
            <img src="/icons/icon-user.svg" alt="" />
            <input
              type="text"
              id="first-name"
              name="firstName"
              placeholder="Enter your first name"
              aria-describedby="first-name-error"
              required
            />
          </div>
          <span id="first-name-error" role="alert"></span>
        </div>

        <div class="form-field">
          <div class="input-wrapper">
            <label for="last-name" class="visually-hidden"
              >Enter your last name</label
            >
            <img src="/icons/icon-user.svg" alt="" />
            <input
              type="text"
              id="last-name"
              name="lastName"
              placeholder="Enter your last name"
              aria-describedby="last-name-error"
              required
            />
          </div>
          <span id="last-name-error" role="alert"></span>
        </div>
      </fieldset>

      <fieldset>
        <legend class="visually-hidden">Access data</legend>
        <div class="form-field">
          <div class="input-wrapper">
            <label for="email" class="visually-hidden"
              >Your email address</label
            >
            <img src="/icons/icon-email.svg" alt="" />
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Your email address"
              aria-describedby="email-error"
              required
            />
          </div>
          <span id="email-error" role="alert"></span>
        </div>

        <div class="form-field">
          <div class="input-wrapper">
            <label for="password" class="visually-hidden"
              >Create a password</label
            >
            <img src="/icons/icon-password.svg" alt="" />
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Create a password"
              aria-describedby="password-error"
              required
            />
          </div>
          <span id="password-error" role="alert"></span>
        </div>
      </fieldset>

      <div class="terms-and-conditions-checkbox">
        <input
          type="checkbox"
          id="terms"
          name="terms-checkbox"
          value="accepted"
          required
        />
        <label for="terms">I accept the Terms and Conditions</label>
      </div>

      <button type="submit" class="btn btn-primary">Sign up</button>
    </form>

    <div class="separator">
      <span class="separator-line"></span>
      <span class="separator-text">Or</span>
      <span class="separator-line"></span>
    </div>

    <div class="social-login">
      <button type="button" class="social-btn apple">
        <img src="/icons/icon-apple.svg" alt="" />
        Continue with Apple
      </button>

      <button type="button" class="social-btn google">
        <img src="/icons/icon-google.svg" alt="" />
        Continue with Google
      </button>
      <button type="button" class="social-btn facebook">
        <img src="/icons/icon-facebook.svg" alt="" />
        Continue with Facebook
      </button>
    </div>

    <footer class="login-footer">
      <p>
        <span class="footer-text">Already registered?</span>
        <a class="footer-link" href="#">Log In</a>
      </p>
    </footer>
  </div>
</main>
